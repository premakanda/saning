content: '## Начните с источника воды


  Вода из централизованного водопровода и собственного колодца или скважины может заметно различаться по составу. Прозрачность не показывает наличие всех растворённых примесей или микробиологических загрязнений, поэтому для выбора оборудования полезен лабораторный анализ по актуальным показателям.


  ## Для чего нужны разные фильтры


  **Механические фильтры** задерживают частицы песка, ржавчины и другие взвеси. **Угольные ступени** в подходящих условиях помогают уменьшить некоторые запахи и привкусы. **Умягчители** применяют при повышенной жёсткости, а специальные системы подбирают для конкретных загрязнений.


  Питьевые системы под мойкой решают другую задачу и не всегда заменяют обработку воды для всего дома.


  ## Как устроить узел водоподготовки


  Предусмотрите доступ для замены картриджей, обслуживания фильтров, запорные краны, контроль давления и возможность отвода промывочной воды, если она нужна оборудованию.


  ## Типичная ошибка


  Покупать многоступенчатую систему «на всякий случай». Лучше сначала узнать состав воды и расход, а затем подобрать ступени очистки и их производительность. Для оценки безопасности питьевой воды ориентируйтесь на результаты анализа и применимые санитарные требования.'

