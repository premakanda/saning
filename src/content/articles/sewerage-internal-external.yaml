content: '## Внутренняя канализация


  Внутренняя сеть собирает стоки от унитазов, раковин, душевых и другой сантехники. Её элементы — отводы, стояки, горизонтальные трубопроводы и ревизии. Расположение сантехнических приборов желательно определить до прокладки труб.


  ## Наружная канализация


  Наружный трубопровод отводит стоки от здания к существующей сети или предусмотренному проектом сооружению очистки. Для самотёчной системы важно правильно выбрать глубину заложения, уклон, повороты и способ защиты трубы.


  ## Частые ошибки


  Неподходящий уклон, чрезмерное количество резких поворотов и отсутствие доступа для прочистки способны усложнить эксплуатацию. Вентиляция канализации также важна для стабильной работы гидрозатворов сантехнических приборов.


  ## На что обратить внимание


  Проверьте маршрут труб, места ревизий и доступность обслуживания ещё до отделочных работ и засыпки траншей. Если отвести стоки самотёком невозможно, может потребоваться насосная установка. Конкретные диаметры и уклоны определяют по проекту и применимым нормам.'

