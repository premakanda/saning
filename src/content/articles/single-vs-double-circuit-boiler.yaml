content: '## В чём разница


  **Одноконтурный котёл** предназначен прежде всего для нагрева теплоносителя системы отопления. Для приготовления горячей воды его часто объединяют с бойлером косвенного нагрева и подходящей автоматикой.


  **Двухконтурный котёл** обычно обеспечивает и отопление, и нагрев воды для бытовых нужд. У многих моделей горячая вода подготавливается проточным способом, поэтому важны расход, температура входящей воды и количество одновременно открытых кранов.


  ## Когда удобен бойлер


  Бойлер косвенного нагрева создаёт запас горячей воды. Это бывает полезно при нескольких санузлах и одновременном использовании разных точек. Но система требует места, дополнительных подключений и корректной настройки.


  ## Когда подходит двухконтурный вариант


  Для компактного дома с умеренным потреблением горячей воды двухконтурный котёл может быть практичным решением. Его фактический комфорт зависит от мощности, производительности по ГВС и схемы водоснабжения.


  ## Как принять решение


  Сравните число точек водоразбора, привычку пользоваться ими одновременно, доступное пространство и условия обслуживания. Тип котла выбирают по расчёту и совместимости с системой. Работы с газовым оборудованием и его подключением выполняют только уполномоченные специалисты в соответствии с местными требованиями.'

