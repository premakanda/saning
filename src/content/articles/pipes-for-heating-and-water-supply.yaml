content: '## Основные материалы


  В современных системах отопления и водоснабжения применяют трубы из полипропилена, сшитого полиэтилена (PEX), термостойкого полиэтилена (PE-RT), металлополимера, меди и нержавеющей стали. У каждого материала есть свои требования к соединениям и допустимым условиям работы.


  **Полипропилен** используют в отдельных системах водоснабжения и отопления. Для него важны температурный режим, компенсация расширения и качество сварных соединений.


  **PEX и PE-RT** удобны для длинных контуров, в том числе водяного тёплого пола. При выборе учитывают назначение трубы, класс эксплуатации и совместимые фитинги.


  **Металлополимерные трубы** позволяют выполнять аккуратную разводку, но требуют соблюдения технологии соединений. **Медь и нержавеющая сталь** востребованы в технических узлах и котельных; выбор определяется проектом, бюджетом и условиями монтажа.


  ## Что важнее названия материала


  Обращайте внимание на рабочее давление и температуру, способ соединения, наличие подходящих фитингов и доступность обслуживания. Для скрытой прокладки особенно важно свести к минимуму необслуживаемые соединения.


  ## Как выбрать


  Нет одной трубы, одинаково лучшей для всех задач. Трубопроводы котельной, горячей воды, радиаторов и тёплого пола работают в разных условиях. Поэтому материал и диаметр подбирают под конкретный контур, а не только по цене.'

