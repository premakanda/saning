title: Когда планировать отопление и водоснабжение при строительстве или ремонте
slug: plan-engineering-before-renovation
description: 'Почему инженерные коммуникации лучше продумать до отделки: схема труб, коллекторы, котельная, санузлы и доступ к оборудованию.'
